packages:
  - "packages/*"
  - "showcase/*"
allowBuilds:
  esbuild: true
  # Skia ships its platform archives as packages; postinstall copies them into libs/.
  '@shopify/react-native-skia': true

# 전이 의존성의 보안 하한. 상위 패키지가 선언한 range 안에 패치가 있는데도 lockfile이
# 옛 버전에 고정돼 있을 때만 쓴다. 상위가 따라오면 항목을 지우고 같은 버전이 나오는지 확인한다.
overrides:
  # Native host stays on Storybook 10.4.4 / safe-area 5.7.0 (installed binary).
  # Its caret dependencies drifted to UI 10.6 requiring a different native peer.
  # Scope React pins to Native parents so Web retains its own 10.6 renderer.
  # Remove after the Native host and its transitive UI are upgraded together.
  '@storybook/react-native-ui': 10.4.4
  '@storybook/react-native-ui-common': 10.4.4
  '@storybook/react-native-theming': 10.4.4
  '@storybook/react-native@10.4.4>@storybook/react': 10.4.0
  '@storybook/react-native-ui@10.4.4>@storybook/react': 10.4.0
  '@storybook/react-native-ui-common@10.4.4>@storybook/react': 10.4.0
  # Expo 57 prebuilt RN requires these upstream podspec fixes (RCT_USE_RN_DEP).
  # Zeego pins older peers; override only after full native adapter validation.
  react-native-ios-context-menu: 3.2.1
  react-native-ios-utilities: 5.2.0
  # valibot 1 계열만. @storybook/mcp·@tmcp/adapter-valibot·@valibot/to-json-schema가
  # 1.2.0에 머물러 있었고 같은 트리에 1.4.2가 이미 있었다. 같은 major 안의 minor라
  # 안전하고, 중복 사본도 함께 없어진다.
  valibot@^1: ^1.4.2
  # medium: uuid v3/v5/v6에 buf를 넘길 때의 경계 검사 누락(CVE-2026-41907).
  # xcode@3.0.1(@expo/config-plugins의 Xcode 프로젝트 파서)이 ~7.0.0을 선언해 7.0.3에 머문다.
  # major 4단계 차이라 처음에는 근거를 적고 남겼는데, 그 뒤 taground·unairplane·spint·diairy에
  # 같은 중첩 override를 넣고 각 저장소 검사가 통과하는 것을 확인했다. 선례가 넷이므로 여기도 닫는다.
  #
  # 남겨 두면 Dependabot updater가 매 실행마다 실패한다 — 2026-09-10 실측:
  # `security_update_not_possible {"dependency-name":"uuid","latest-resolvable-version":"7.0.3",
  # "lowest-non-vulnerable-version":"14.0.0"}` 후 `The updater encountered one or more errors`.
  # 즉 닫을 수 없는 권고를 방치하면 Actions가 계속 빨간색으로 남는다.
  'xcode>uuid': 11.1.1

patchedDependencies:
  # RN 0.81+ Kotlin property bridge; remove after Zeego adopts a compatible upstream release.
  '@react-native-menu/menu@1.2.2': patches/@react-native-menu__menu.patch
  # UIAction.subtitle availability guard; remove when upstream fixes iOS 16 annotation.
  'react-native-ios-context-menu@3.2.1': patches/react-native-ios-context-menu.patch
  # Legacy root view is absent from RN 0.86 Fabric; remove when upstream guards the legacy helper.
  'react-native-ios-utilities@5.2.0': patches/react-native-ios-utilities.patch
  # Types must precede the react-native source condition; otherwise Expo typechecks upstream internals.
  # Guard optional teleport native views too: installed JS alone caused a red native placeholder.
  # Remove each fix when upstream ships it. See docs/interaction-adapters.md.
  react-native-screen-transitions@4.0.0: patches/react-native-screen-transitions@4.0.0.patch
