name: Ant Design Reference Drift

# This network-dependent upstream check is intentionally separate from push and
# pull-request gates. A registry outage must not block normal product changes.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Compare the pinned reference with npm latest
        run: npm run reference:antd:verify
