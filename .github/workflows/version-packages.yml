name: Release Packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Detect an untagged fixed-version release commit
        id: release-candidate
        shell: bash
        run: |
          VERSION="$(node -p "require('./packages/design-contracts/package.json').version")"
          TAG="v${VERSION}"
          if git show-ref --tags --verify --quiet "refs/tags/${TAG}"; then
            echo "::notice::${TAG} already exists; this push did not change the fixed package version."
            echo "should-release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if find .changeset -maxdepth 1 -name '*.md' ! -name README.md | grep -q .; then
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              echo "::error::Authored Changesets remain. Run pnpm release:version, commit the generated artifacts, and push that commit before dispatching this workflow."
              exit 1
            fi
            echo "::warning::Authored Changesets remain; ${TAG} waits for a generated version commit."
            echo "should-release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LATEST_TAG="$(git describe --tags --match 'v[0-9]*' --abbrev=0 2>/dev/null || true)"
          if [ -n "${LATEST_TAG}" ]; then
            PREVIOUS_VERSION="$(git show "${LATEST_TAG}:packages/design-contracts/package.json" | node -e 'let value=""; process.stdin.on("data", chunk => value += chunk); process.stdin.on("end", () => console.log(JSON.parse(value).version));')"
            if [ "${PREVIOUS_VERSION}" = "${VERSION}" ]; then
              echo "::error::Package version ${VERSION} has not advanced beyond ${LATEST_TAG}."
              exit 1
            fi
          fi
          echo "::notice::Releasing ${TAG}."
          echo "should-release=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.release-candidate.outputs.should-release == 'true'
        run: pnpm install --frozen-lockfile

      - name: Verify the pushed commit is a generated release commit
        if: steps.release-candidate.outputs.should-release == 'true'
        run: pnpm release:commit:check "$(git rev-parse HEAD^)"

      - name: Install Chromium before release verification
        if: steps.release-candidate.outputs.should-release == 'true'
        run: pnpm --filter @hjm/react exec playwright install --with-deps chromium

      - name: Verify the canonical release candidate
        if: steps.release-candidate.outputs.should-release == 'true'
        shell: bash
        run: |
          pnpm release:check
          git diff --exit-code -- packages/design-contracts/dist packages/react/dist packages/react-native/dist packages/design-contracts/docs/generated
          test -z "$(git ls-files --others --exclude-standard -- packages/design-contracts/dist packages/react/dist packages/react-native/dist packages/design-contracts/docs/generated)"

      - name: Require successful private consumer surface evidence
        if: steps.release-candidate.outputs.should-release == 'true'
        env:
          HJM_CONSUMER_SYNC_TOKEN: ${{ secrets.HJM_CONSUMER_SYNC_TOKEN }}
        run: |
          VERSION="$(node -p "require('./packages/design-contracts/package.json').version")"
          node scripts/check-consumer-release.mjs \
            --repository "${GITHUB_REPOSITORY}" \
            --release-sha "${GITHUB_SHA}" \
            --version "${VERSION}"

      - name: Create the canonical Git install tag
        if: steps.release-candidate.outputs.should-release == 'true'
        shell: bash
        run: |
          HEAD_COMMIT="$(git rev-parse HEAD)"
          if [ "${HEAD_COMMIT}" != "${GITHUB_SHA}" ]; then
            echo "::error::Tag checkout ${HEAD_COMMIT} does not match verified release ${GITHUB_SHA}."
            exit 1
          fi
          VERSION="$(node -p "require('./packages/design-contracts/package.json').version")"
          TAG="v${VERSION}"
          if git show-ref --tags --verify --quiet "refs/tags/${TAG}"; then
            TAG_COMMIT="$(git rev-list -n 1 "${TAG}")"
            if [ "${TAG_COMMIT}" != "${HEAD_COMMIT}" ]; then
              echo "::error::${TAG} already points to ${TAG_COMMIT}, not this release commit ${HEAD_COMMIT}."
              exit 1
            fi
            echo "::error::${TAG} was created while this workflow was running."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "HJM design system ${VERSION}"
          git push origin "${TAG}"
