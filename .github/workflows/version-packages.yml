# Deployment only: queue concurrent requests; no separate CI gates.
name: Release Packages
on:
  workflow_dispatch: null
permissions:
  actions: write
  contents: write
  id-token: write
concurrency:
  group: deployment
  cancel-in-progress: false
  queue: max
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.18.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm --filter @hjmds/design-contracts build && pnpm --filter @hjmds/react build && pnpm --filter @hjmds/react-native build
      - name: Publish packages
        shell: bash
        run: |
          VERSION="$(node -p "require('./packages/design-contracts/package.json').version")"
          for directory in design-contracts react react-native; do
            NAME="$(node -p "require('./packages/${directory}/package.json').name")"
            if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
              echo "::notice::${NAME}@${VERSION} is already published; skipping."
              continue
            fi
            pnpm --filter "${NAME}" publish --access public --no-git-checks --provenance
          done
      - name: Tag release
        shell: bash
        run: |
          VERSION="$(node -p "require('./packages/design-contracts/package.json').version")"
          TAG="v${VERSION}"
          git fetch --tags --force
          if git show-ref --tags --verify --quiet "refs/tags/${TAG}"; then
            test "$(git rev-list -n 1 "${TAG}")" = "${GITHUB_SHA}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "HJM design system ${VERSION}"
          git push origin "${TAG}"
      # GITHUB_TOKEN-created tags do not trigger another workflow; dispatch the same immutable tag explicitly.
      - name: Publish release Showcase
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./packages/design-contracts/package.json').version")"
          gh workflow run showcase.yml --ref "v${VERSION}"
