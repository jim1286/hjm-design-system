name: Release Packages

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-packages
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @hjmds/react exec playwright install --with-deps chromium

      - name: Verify release commit
        run: pnpm release:commit:check "$(git rev-parse HEAD^)"

      - name: Verify packages, evidence, and release artifacts
        run: pnpm release:check

      - name: Publish packages
        shell: bash
        run: |
          VERSION="$(node -p "require('./packages/design-contracts/package.json').version")"
          for directory in design-contracts react react-native; do
            NAME="$(node -p "require('./packages/${directory}/package.json').name")"
            if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
              echo "::notice::${NAME}@${VERSION} is already published; skipping."
              continue
            fi
            pnpm --filter "${NAME}" publish --access public --no-git-checks --provenance
          done

      - name: Tag release
        shell: bash
        run: |
          VERSION="$(node -p "require('./packages/design-contracts/package.json').version")"
          TAG="v${VERSION}"
          git fetch --tags --force
          if git show-ref --tags --verify --quiet "refs/tags/${TAG}"; then
            test "$(git rev-list -n 1 "${TAG}")" = "${GITHUB_SHA}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "HJM design system ${VERSION}"
          git push origin "${TAG}"
