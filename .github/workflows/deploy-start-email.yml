# The owner requested start and completion emails through the same Gmail channel.
# Observe both independently so SMTP failure does not change deployment dependencies.
name: Deployment email
on:
  workflow_run:
    workflows: ["Design System Showcase", "Release Packages"]
    types: [in_progress, completed]
    branches: [main]
permissions: {}
jobs:
  email:
    # Never execute or check out the triggering run's code in this privileged event.
    if: github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send deployment run link through Gmail
        env:
          DEPLOY_MAIL_USERNAME: ${{ secrets.DEPLOY_MAIL_USERNAME }}
          DEPLOY_MAIL_APP_PASSWORD: ${{ secrets.DEPLOY_MAIL_APP_PASSWORD }}
          DEPLOY_MAIL_TO: ${{ vars.DEPLOY_MAIL_TO }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import smtplib
          import ssl
          from email.message import EmailMessage
          from email.utils import formatdate, make_msgid

          username = os.environ['DEPLOY_MAIL_USERNAME']
          password = os.environ['DEPLOY_MAIL_APP_PASSWORD']
          if not username or not password:
              raise SystemExit('Set DEPLOY_MAIL_USERNAME and DEPLOY_MAIL_APP_PASSWORD in Actions secrets.')
          recipient = os.environ.get('DEPLOY_MAIL_TO') or username
          with open(os.environ['GITHUB_EVENT_PATH']) as source:
              event = json.load(source)
          run = event['workflow_run']
          repository = event['repository']['full_name']
          attempt = run['run_attempt']
          link = f"{run['html_url']}/attempts/{attempt}"
          completed = event['action'] == 'completed'
          if completed:
              conclusion = run['conclusion']
              if not conclusion:
                  raise SystemExit('Completed workflow event has no conclusion.')
              result = {
                  'success': '성공', 'failure': '실패', 'cancelled': '취소',
                  'timed_out': '시간 초과', 'skipped': '건너뜀', 'neutral': '중립',
                  'action_required': '조치 필요', 'stale': '만료',
                  'startup_failure': '시작 실패',
              }.get(conclusion, conclusion)
              label = f'배포 종료 · {result}'
              description = f'배포 워크플로가 종료되었습니다. 결과: {result} ({conclusion})'
          else:
              label = '배포 시작'
              description = '배포 워크플로가 실행을 시작했습니다.'
          message = EmailMessage()
          message['From'] = username
          message['To'] = recipient
          message['Subject'] = f"[{label}] {repository} · {run['name']} · #{run['run_number']} ({attempt}회차)"
          message['Date'] = formatdate(localtime=False)
          message['Message-ID'] = make_msgid()
          message.set_content('\n'.join([
              description,
              f"저장소: {repository}",
              f"워크플로: {run['name']}",
              f"브랜치: {run['head_branch']}",
              f"커밋: {run['head_sha']}",
              f"시작 시각 (UTC): {run['run_started_at']}",
              f"실행 링크: {link}",
              '',
              '이 메일은 워크플로 실행 상태 알림입니다. 스토어 심사·공개 여부는 별도로 확인하세요.',
          ]))
          # Gmail app passwords require verified TLS; never use a normal account password.
          with smtplib.SMTP_SSL('smtp.gmail.com', 465, context=ssl.create_default_context(), timeout=30) as smtp:
              smtp.login(username, password)
              refused = smtp.send_message(message)
              if refused:
                  raise SystemExit('SMTP refused one or more recipients.')
          print('Gmail SMTP accepted the deployment status email (inbox delivery is unverified).')
          PYTHON
