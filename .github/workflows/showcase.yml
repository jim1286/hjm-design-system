# Deployment only: queue concurrent requests; no separate CI gates.
name: Design System Showcase
on:
  push:
    branches:
      - main
    paths:
      - packages/design-contracts/package.json
      - packages/react/package.json
      - packages/react-native/package.json
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: deployment
  cancel-in-progress: false
  queue: max
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Storybook
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.18.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Storybook
        run: pnpm showcase:web:build
      - name: Prepare Storybook delivery artifact
        env:
          STORYBOOK_ARTIFACT: ${{ runner.temp }}/hjm-storybook
        run: |
          python3 deploy/storybook/artifact.py prepare "$PWD/showcase/web/storybook-static" "$STORYBOOK_ARTIFACT" "$GITHUB_SHA" "$GITHUB_RUN_ID"
          cp deploy/storybook/redirect/index.html deploy/storybook/redirect/iframe.html
          cp deploy/storybook/redirect/index.html deploy/storybook/redirect/404.html
      - name: Upload Storybook delivery artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hjm-storybook-${{ github.sha }}
          path: ${{ runner.temp }}/hjm-storybook
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
      - name: Upload Storybook
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: deploy/storybook/redirect
