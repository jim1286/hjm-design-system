name: Design System Showcase

on:
  push:
    branches:
      - main
    # 2026-10-07 사용자 재확인: 일반 push/PR은 원격 전량 검사를 실행하지 않는다.
    # paths는 후보만 좁히고, 아래 intent job이 의존성 변경과 실제 버전 상승을 구분한다.
    paths:
      - packages/design-contracts/package.json
      - packages/react/package.json
      - packages/react-native/package.json
  workflow_dispatch:

# Pages 쓰기는 배포 job에만 준다. 수동 브랜치 검사는 읽기 권한만 사용한다.
permissions:
  contents: read

# ref별로 격리하고, main 배포가 다음 요청 때문에 중간에 끊기지 않게 한다.
concurrency:
  group: design-system-showcase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  intent:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.version.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # push에는 여러 commit이 함께 포함될 수 있어 HEAD^가 아닌 event.before와 비교한다.
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Determine version intent
        id: version
        env:
          VERSION_BASE_SHA: ${{ github.event.before }}
        run: node scripts/ci-version-intent.mjs

  verify:
    needs: intent
    if: needs.intent.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.18.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @hjmds/react exec playwright install --with-deps chromium

      - name: Verify packages, evidence, and both showcases
        run: pnpm ci:check

      - name: Upload Storybook
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: showcase/web/storybook-static

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Storybook
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
