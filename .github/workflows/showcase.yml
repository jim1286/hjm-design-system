name: Design System Showcase

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# pages·id-token 쓰기는 deploy job에만 준다. 워크플로 전체에 두면 PR 검증도 Pages 배포
# 권한을 가진 토큰으로 돌았다(2026-09-26 CI 검토).
permissions:
  contents: read

# ref마다 그룹을 나눈다. 그룹 하나에 cancel-in-progress였을 때는 PR push가 main의 검증·
# Pages 배포를 취소했다(2026-09-26 CI 검토). main은 배포 도중 끊기지 않게 취소하지 않는다.
concurrency:
  group: design-system-showcase-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @hjmds/react exec playwright install --with-deps chromium

      - name: Verify packages, evidence, and both showcases
        run: pnpm ci:check

      - name: Upload Storybook
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: showcase/web/storybook-static

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Storybook
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1